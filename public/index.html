<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vr.phylab.uk</title>
<meta name="description" content="Physics in 3D and VR: choose a project.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%230d6b5f%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/vr.css">
</head>
<body class="home">
<main class="menu">
  <header class="menu-head">
    <h1>vr<span>.phylab.uk</span></h1>
    <p>Choose a project. In a headset, point at a box and press the trigger or pinch.</p>
  </header>
  <nav id="projects" class="boxes" aria-label="Projects"></nav>
  <p class="menu-foot"><a href="https://phylab.uk">phylab.uk</a> · <a href="https://learn.phylab.uk">learn.phylab.uk</a></p>
</main>
<script type="module">
  import { PROJECTS } from "/projects.js";
  import { vrLinks } from "/xr-nav.js";
  vrLinks(document.getElementById("projects"));
  document.getElementById("projects").innerHTML = PROJECTS.map((p) =>
    `<a class="box" href="/${p.slug}/"><span class="box-title">${p.title}</span><span class="box-blurb">${p.blurb}</span><span class="box-go">Open ›</span></a>`).join("");
</script>
</body>
</html>
